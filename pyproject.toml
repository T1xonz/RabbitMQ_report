[project]
name = "rabbitmq-lab"
version = "0.1.0"
description = "Учебные примеры очередей задач и маршрутизации событий в RabbitMQ"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pika==1.4.4"]

[project.scripts]
rabbit-publish = "rabbitmq_lab.tasks_publish:main"
rabbit-worker = "rabbitmq_lab.task_worker:main"
rabbit-events = "rabbitmq_lab.events:main"

[dependency-groups]
dev = ["ruff>=0.17.1,<0.18"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
